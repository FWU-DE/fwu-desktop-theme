name: Pakete

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketbaum erzeugen
        run: python3 tools/build.py "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Paketbaum erzeugen (Testversion)
        run: python3 tools/build.py "$(cat VERSION)"
        if: "!startsWith(github.ref, 'refs/tags/')"

      - name: nfpm installieren
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin nfpm

      - name: Pakete bauen
        run: |
          mkdir -p dist
          for p in deb rpm apk archlinux; do
            nfpm package --config build/nfpm.yaml --packager "$p" --target dist/
          done
          tar -czf "dist/fwu-desktop-theme-$(cat VERSION).tar.gz" -C build root
          ls -l dist

      - name: Debian-Paket testen
        run: |
          sudo apt-get install -y ./dist/*.deb
          fwu-theme wallpaper list
          test -L /usr/share/fwu-desktop-theme/omarchy/fwu-dark/backgrounds

      - uses: actions/upload-artifact@v4
        with:
          name: pakete
          path: dist/*

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
