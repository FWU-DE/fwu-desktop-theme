name: Pakete

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: nfpm installieren
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Pakete bauen
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version=${GITHUB_REF_NAME#v} ;;
            *) version=0.0.0+${GITHUB_SHA::7} ;;
          esac
          tools/package.sh "$version"

      - name: Debian-Paket testen
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/*.deb
          fwu-theme wallpaper list
          test -f /usr/share/themes/FWU-Dark/gnome-shell/gnome-shell.css
          test -f /usr/share/fwu-desktop-theme/themes/fwu-dark/colors.toml

      - name: Benutzer-Installation testen
        run: |
          ./install.sh --omarchy
          ~/.local/bin/fwu-theme wallpaper list
          test -L ~/.config/omarchy/themes/fwu-dark
          ./install.sh --uninstall
          test ! -e ~/.local/bin/fwu-theme

      - uses: actions/upload-artifact@v4
        with:
          name: pakete
          path: dist/*

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
